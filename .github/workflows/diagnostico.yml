# Verifica, de fora, se a Evolution e o PRICALL estão respondendo.
#
# Existe porque o assistente não alcança a Evolution a partir do ambiente dele
# — o proxy recusa a conexão. Este fluxo roda na rede do GitHub e devolve um
# relatório legível, sem expor nenhum segredo.
#
# Nada aqui altera configuração: só faz leitura e conta o que encontrou.
name: Diagnóstico

on:
  workflow_dispatch:
  # O assistente não tem permissão para disparar fluxos pela API, mas tem para
  # fazer push. Tocar o arquivo de gatilho é como ele pede uma execução.
  push:
    paths:
      - ".github/gatilhos/diagnostico"
      - ".github/workflows/diagnostico.yml"

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Evolution API
        env:
          URL: https://evoapiopen.openwave.online
          INSTANCIA: pricall
          APIKEY: ${{ secrets.EVOLUTION_API_KEY }}
        run: |
          set -uo pipefail
          {
            echo "## Evolution API"
            echo ""
            echo "Endereço: \`$URL\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          codigo=$(curl -sS -o /tmp/raiz.txt -w '%{http_code}' --max-time 20 "$URL" || echo 000)

          if [ "$codigo" = "000" ]; then
            {
              echo "**O servidor não respondeu.**"
              echo ""
              echo "A Evolution está fora do ar, o endereço está errado ou o"
              echo "firewall bloqueia acesso externo. Enquanto isso não resolver,"
              echo "o PRICALL não tem como enviar nem receber mensagem."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Servidor respondeu — HTTP \`$codigo\`." >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${APIKEY:-}" ]; then
            {
              echo ""
              echo "Sem o secret \`EVOLUTION_API_KEY\`, não dá para consultar o"
              echo "estado da instância. Cadastre-o para o diagnóstico completo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          estado=$(curl -sS --max-time 20 \
            -H "apikey: $APIKEY" \
            "$URL/instance/connectionState/$INSTANCIA" 2>/dev/null || echo '{}')

          # `open` = pareado com o WhatsApp. `close`/`connecting` = precisa ler o QR.
          situacao=$(echo "$estado" | jq -r '.instance.state // .state // "desconhecido"')

          {
            echo ""
            echo "Instância \`$INSTANCIA\`: **$situacao**"
            echo ""
            case "$situacao" in
              open) echo "Pareada com o WhatsApp. É o estado que o PRICALL espera." ;;
              connecting|close) echo "Não pareada — leia o QR Code no painel da Evolution." ;;
              *) echo "Estado não reconhecido. A instância pode não existir com esse nome." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

      - name: PRICALL
        run: |
          set -uo pipefail
          {
            echo ""
            echo "## PRICALL"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          login=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://pricall.vercel.app/entrar || echo 000)
          echo "- Tela de login: \`$login\`" >> "$GITHUB_STEP_SUMMARY"

          # Sem o cabeçalho do token, o webhook TEM de recusar. Um 200 aqui
          # significaria que qualquer um na internet consegue injetar mensagem.
          webhook=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST -H 'content-type: application/json' -d '{}' \
            https://pricall.vercel.app/api/webhooks/whatsapp || echo 000)

          if [ "$webhook" = "401" ] || [ "$webhook" = "403" ]; then
            echo "- Webhook sem token: \`$webhook\` — recusado, como deve ser" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ Webhook sem token: \`$webhook\` — **deveria recusar**" >> "$GITHUB_STEP_SUMMARY"
          fi
