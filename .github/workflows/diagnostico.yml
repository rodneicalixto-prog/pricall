# Verifica, de fora, se a Evolution e o PRICALL estão respondendo.
#
# Existe porque o assistente não alcança a Evolution a partir do ambiente dele
# — o proxy recusa a conexão. Este fluxo roda na rede do GitHub e devolve um
# relatório legível, sem expor nenhum segredo.
#
# O relatório sai no log E no resumo da execução. Os dois, de propósito: o
# resumo é para você ler na interface, o log é o único que o assistente
# consegue buscar pela API.
#
# Nada aqui altera configuração: só faz leitura e conta o que encontrou.
name: Diagnóstico

on:
  workflow_dispatch:
  # O assistente não tem permissão para disparar fluxos pela API, mas tem para
  # fazer push. Tocar o arquivo de gatilho é como ele pede uma execução.
  push:
    paths:
      - ".github/gatilhos/diagnostico"
      - ".github/workflows/diagnostico.yml"

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      URL: https://evoapiopen.openwave.online
      INSTANCIA: pricall
      APIKEY: ${{ secrets.EVOLUTION_API_KEY }}
      APP: https://pricall.vercel.app
    steps:
      - name: Verificar
        run: |
          set -uo pipefail

          # Escreve nos dois destinos de uma vez.
          relatar() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          relatar "## Evolution"
          relatar ""

          raiz=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)

          if [ "$raiz" = "000" ]; then
            relatar "**Não respondeu.** Fora do ar, endereço errado ou bloqueio de firewall."
            relatar "Enquanto isso durar, o PRICALL não envia nem recebe mensagem."
          else
            relatar "Servidor no ar — HTTP \`$raiz\`."

            if [ -z "${APIKEY:-}" ]; then
              relatar ""
              relatar "Falta o secret \`EVOLUTION_API_KEY\` para consultar a instância."
            else
              # A Evolution mudou o caminho entre versões; tentamos os dois.
              corpo=$(curl -sS --max-time 20 -H "apikey: $APIKEY" \
                "$URL/instance/connectionState/$INSTANCIA" 2>/dev/null || echo '{}')
              estado=$(echo "$corpo" | jq -r '.instance.state // .state // empty' 2>/dev/null || true)

              if [ -z "$estado" ]; then
                relatar ""
                relatar "Resposta inesperada ao consultar \`$INSTANCIA\`. Instâncias existentes:"
                # fetchInstances lista o que existe de fato — resolve nome errado.
                lista=$(curl -sS --max-time 20 -H "apikey: $APIKEY" \
                  "$URL/instance/fetchInstances" 2>/dev/null || echo '[]')
                nomes=$(echo "$lista" | jq -r '(.. | objects | select(has("instanceName")) | .instanceName), (.[]?.name // empty)' 2>/dev/null | sort -u | head -20)
                relatar "${nomes:-(nenhuma retornada — a apikey pode estar errada)}"
              else
                relatar ""
                relatar "Instância \`$INSTANCIA\`: **$estado**"
                case "$estado" in
                  open) relatar "Pareada com o WhatsApp — é o que o PRICALL espera." ;;
                  connecting|close) relatar "Não pareada. Leia o QR Code no painel da Evolution." ;;
                  *) relatar "Estado não reconhecido." ;;
                esac
              fi
            fi
          fi

          relatar ""
          relatar "## PRICALL"
          relatar ""

          login=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$APP/entrar" || echo 000)
          relatar "- Tela de login: \`$login\`"

          # O webhook é público, então tem de recusar tudo que não comprove
          # origem. Dois casos, porque falham por motivos diferentes:
          #
          #   envelope desconhecido → 400 (não cai no provedor de demonstração)
          #   envelope da Evolution sem token → 401 (assinatura não confere)
          #
          # Um 200 em qualquer um deles significa que a internet inteira
          # consegue injetar conversa forjada na central.
          conferir() {
            local rotulo="$1" corpo="$2"
            local resposta
            resposta=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -X POST -H 'content-type: application/json' -d "$corpo" \
              "$APP/api/webhooks/whatsapp" || echo 000)
            case "$resposta" in
              400|401|403) relatar "- $rotulo: \`$resposta\` — recusado, como deve ser" ;;
              *) relatar "- ⚠️ $rotulo: \`$resposta\` — **deveria recusar**" ;;
            esac
          }

          conferir "Envelope desconhecido" '{}'
          conferir "Envelope normalizado" '{"kind":"message","content":"forjada"}'
          conferir "Evolution sem token" \
            '{"event":"messages.upsert","instance":"pricall","data":{}}'
